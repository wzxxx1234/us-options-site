<title>美股选股手册</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* 布局：顶部“全市场点阵”（一格一家公司）→ 粘性栏目与搜索 → 左侧分组筛选栏 + 右侧结果；点阵、筛选栏、结果共用同一份筛选状态 */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --sunk:#E7ECE9; --ink:#12211D; --muted:#52625C; --line:#D5DCD8;
  --accent:#0B6B6B; --accent-ink:#FFFFFF; --accent-soft:#DCEDEB;
  --sp:#2447C8; --sp-soft:#E1E7FB; --ndx:#A32570; --ndx-soft:#F8E1EE; --dow:#93500A; --dow-soft:#F7E8D3;
  --warn:#8A4B00; --warn-soft:#FBEFD9; --star:#C98A00; --gain:#1c7a38; --loss:#c0271c; --gain-fill:rgba(28,122,56,.13); --loss-fill:rgba(192,39,28,.10); --off:.13;--tm-mid:#b9bdb8;--tm-na:#dcded9;--tm-hot:#d24b3f;
  --s0:#3B6FE0; --s1:#1E9E8A; --s2:#D1477A; --s3:#E0703B; --s4:#8A5BE0; --s5:#8C7A5B; --s6:#6FA83A; --s7:#C9A227; --s8:#3FB5D6; --s9:#5E7FA8; --s10:#7D8A2E;
  --m-dow:#D98A1F; --m-ndx:#C2459A; --m-sp:#4B6FE3; --m-none:#9AA8A2;
  --shadow:0 1px 2px rgba(18,33,29,.06),0 8px 24px rgba(18,33,29,.08);
  --f-display:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --wrap:1280px; --bar-h:67px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1e1d1a; --sunk:#292723; --ink:#ebe7df; --muted:#a8a399; --line:#38352f;
  --accent:#8fb0f5; --accent-ink:#0f1b38; --accent-soft:#232b40;
  --sp:#9db4ff; --sp-soft:#222b4a; --ndx:#e9a0cb; --ndx-soft:#3d2434; --dow:#e3b673; --dow-soft:#3a2d16;
  --warn:#f0a94a; --warn-soft:#33270f; --star:#f2c14e; --gain:#4cc26e; --loss:#f0675c; --gain-fill:rgba(76,194,110,.16); --loss-fill:rgba(240,103,92,.15);
  --s0:#7396e6; --s1:#4fb3a1; --s2:#d67a9d; --s3:#dd8c62; --s4:#a48ae0; --s5:#a39479; --s6:#8fbb66; --s7:#d2b352; --s8:#66bdd6; --s9:#839dbe; --s10:#a1ab5c;
  --m-dow:#e3b673; --m-ndx:#e08fc0; --m-sp:#7396e6; --m-none:#4b4841; --off:.2;--tm-mid:#46433d;--tm-na:#2f2d29;--tm-hot:#e2625a;
  --shadow:0 14px 32px -16px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1e1d1a; --sunk:#292723; --ink:#ebe7df; --muted:#a8a399; --line:#38352f;
  --accent:#8fb0f5; --accent-ink:#0f1b38; --accent-soft:#232b40;
  --sp:#9db4ff; --sp-soft:#222b4a; --ndx:#e9a0cb; --ndx-soft:#3d2434; --dow:#e3b673; --dow-soft:#3a2d16;
  --warn:#f0a94a; --warn-soft:#33270f; --star:#f2c14e; --gain:#4cc26e; --loss:#f0675c; --gain-fill:rgba(76,194,110,.16); --loss-fill:rgba(240,103,92,.15);
  --s0:#7396e6; --s1:#4fb3a1; --s2:#d67a9d; --s3:#dd8c62; --s4:#a48ae0; --s5:#a39479; --s6:#8fbb66; --s7:#d2b352; --s8:#66bdd6; --s9:#839dbe; --s10:#a1ab5c;
  --m-dow:#e3b673; --m-ndx:#e08fc0; --m-sp:#7396e6; --m-none:#4b4841; --off:.2;--tm-mid:#46433d;--tm-na:#2f2d29;--tm-hot:#e2625a;
  --shadow:0 14px 32px -16px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 页头 ---------- */
.hero{padding-block:28px 20px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,6vw,64px);line-height:1.08;margin:6px 0 10px;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lede{max-width:38em;color:var(--muted);margin:0;font-size:16px}
.theme-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .25s,border-color .2s}
.theme-btn:hover{border-color:var(--accent);transform:rotate(20deg)}
.theme-btn svg{width:20px;height:20px}
.mcb{font-size:11px;font-weight:500;padding:1px 6px;border-radius:5px;white-space:nowrap;margin-right:4px;background:var(--sunk);color:var(--ink)}
.mcb.mc-mega{background:var(--accent-soft);color:var(--accent)}.mcb.mc-mid{background:var(--warn-soft);color:var(--warn)}.mcb.mc-small{color:var(--loss)}
.mcd{display:block;font-size:11px;color:var(--muted);font-weight:400}
.eb,.ub{font-size:11px;font-weight:500;padding:1px 6px;border-radius:5px;white-space:nowrap;margin-right:4px;cursor:help}
.eb{background:var(--sunk);color:var(--ink)}.eb.soon{background:var(--warn-soft);color:var(--warn)}
.ub{background:var(--accent-soft);color:var(--accent)}
.ebadges{margin:-2px 0 8px}
.q{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:4px;border-radius:50%;border:1px solid var(--line);font-size:10px;font-style:normal;font-weight:600;color:var(--muted);cursor:help;vertical-align:1px;line-height:1}
.q:hover,.q:focus{border-color:var(--accent);color:var(--accent);outline:none}
.gtip{position:fixed;z-index:70;left:0;top:0;padding:8px 11px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.gtip.on{opacity:1;transform:none}
.keyline{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--muted)}.keyline b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.kv2s{display:grid;gap:6px;margin-top:10px}
.kv2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:0 12px;align-items:baseline;background:var(--sunk);border-radius:10px;padding:8px 12px}
.kv2>span{font-size:12px;color:var(--muted);grid-row:span 2}.kv2>b{font-family:var(--f-mono);font-size:15px}.kv2>small{font-size:12px;color:var(--muted)}
.kv2.hot{background:var(--accent-soft)}
.sp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.sp2>div{background:var(--sunk);border-radius:10px;padding:8px 12px}.sp2 span{font-size:12px;color:var(--muted);display:block}.sp2 small{font-size:11.5px;color:var(--muted)}
.spark{display:block;max-width:100%;height:auto;margin:4px 0}.spark path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--accent)}
.spark.iv path{stroke:var(--warn)}.spark.iv circle{fill:var(--warn)}.spark.mini{margin:0}
.cal{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-r{display:grid;grid-template-columns:86px 130px minmax(0,1fr) 64px;gap:4px 12px;align-items:center;padding:9px 14px;background:var(--surface);font-size:13.5px}
.cal-d b{font-family:var(--f-mono);margin-right:6px}.cal-d{color:var(--muted)}.cal-k{font-weight:600}.cal-t{color:var(--muted)}.cal-n{text-align:right;font-size:12px;color:var(--muted)}
.cal-r.off .cal-k{color:var(--loss)}.cal-r.ext .cal-k{color:var(--warn)}.cal-r.live .cal-k{color:var(--accent)}.cal-r.opex .cal-k{color:var(--gain)}
@media (max-width:640px){.cal-r{grid-template-columns:70px minmax(0,1fr) auto}.cal-t{grid-column:1/-1}}
.lbt.watch td small,.lbt.wk small{display:block;font-size:11px;color:var(--muted)}.lbt td.small{font-size:12px;color:var(--muted)}
.wsug{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.tmap{position:relative;width:100%;height:420px;border-radius:10px;overflow:hidden;background:var(--line)}
.tmap .tm-sec{position:absolute;display:block;font-style:normal;cursor:zoom-in;box-shadow:inset 0 0 0 1px var(--bg)}
.tmap .tm-sec span{position:absolute;left:4px;top:1px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:calc(100% - 8px)}
.tmap i{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--c);color:#fff;font-style:normal;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.35);cursor:pointer;transition:opacity .25s,filter .15s;border-radius:2px}
.tmap i b{font-family:var(--f-mono);font-weight:700}.tmap i span{font-size:.72em;opacity:.95;font-family:var(--f-mono)}
.tmap i:hover,.tmap i.hot{filter:brightness(1.18);z-index:2;box-shadow:0 0 0 2px var(--ink)}
.tmap i.off{opacity:.18}
.tm-back{font-size:12.5px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);margin-right:8px;background:var(--surface)}
.tm-scale{display:inline-flex;align-items:center;gap:8px}.tm-scale i{display:inline-block;width:120px;height:9px;border-radius:5px}
.legend .mu{color:var(--muted)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}
@media (prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}
.d-handle{display:none}
@media (max-width:760px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .bar .views{position:fixed;left:0;right:0;bottom:0;z-index:45;border-radius:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .bar .views button{flex:1 0 auto;padding:8px 6px;font-size:13px}
  .bar .views .ind{top:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));background:var(--sunk);box-shadow:none}
  #toast.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #drawer.drawer{top:auto;left:0;right:0;width:100%;max-height:90vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(102%);padding-top:6px}
  #drawer.drawer.on{transform:none}
  .d-handle{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
  .kv2{grid-template-columns:1fr}.kv2>span{grid-row:auto}
}
.datastamp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:14px 0 0;font-size:12.5px;color:var(--muted)}
.datastamp i{width:7px;height:7px;border-radius:50%;background:var(--gain);flex:none}
.datastamp.old i{background:var(--loss)}.datastamp b{color:var(--loss);font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px}
.stat b{display:block;font-family:var(--f-mono);font-weight:600;font-size:clamp(24px,3.4vw,34px);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

/* ---------- 点阵 ---------- */
.mosaic-box{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.mosaic-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.mosaic-head strong{color:var(--ink);font-weight:500}
.mh-r{display:inline-flex;align-items:center;gap:8px}
.toggle{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px}
.toggle button{padding:4px 12px;min-height:32px;border-radius:6px;font-size:13px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.mosaic{display:flex;flex-wrap:wrap;gap:3px}
.mosaic i{width:13px;height:13px;border-radius:3px;background:var(--c);cursor:pointer;transition:opacity .25s}
.mosaic i.off{opacity:var(--off)}
.mosaic{animation:rise .4s backwards}
.mosaic i:hover,.mosaic i.hot{transform:scale(1.7);position:relative;z-index:2;opacity:1}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-family:var(--f-mono);margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend button,.legend span{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 6px;border-radius:6px;transition:background .2s,color .2s}
.legend button:hover{background:var(--sunk);color:var(--ink)}
.legend button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sw{flex:none;display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c)}

/* ---------- 粘性栏 ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);margin-top:18px}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.views{position:relative;display:flex;background:var(--sunk);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.views button{position:relative;z-index:1;padding:8px 14px;min-height:38px;border-radius:8px;font-weight:500;font-size:14px;color:var(--muted);transition:color .2s;white-space:nowrap}
.views button[aria-selected="true"]{color:var(--ink)}
.views button small{font-family:var(--f-mono);font-size:11px;margin-left:5px;padding:0 5px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.views .ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .32s cubic-bezier(.3,1.3,.5,1),width .32s cubic-bezier(.3,1.3,.5,1)}
.search{flex:1 1 240px;position:relative;min-width:0}
.search input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 44px 0 40px;font-size:15px;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:10px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}
.search .clear{position:absolute;right:4px;top:2px;width:40px;height:40px;color:var(--muted);font-size:20px;text-align:center}

/* ---------- 主体：筛选栏 + 结果 ---------- */
main{padding-block:20px 64px;min-height:70vh}
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 14px);max-height:calc(100vh - var(--bar-h) - 28px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px;scrollbar-width:thin}
.side-head,.side-foot{display:none}
.fg{padding:12px 0;border-top:1px solid var(--line)}
.fg:first-of-type{border-top:0}
.fg-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.fg-h b{font-size:13.5px}
.fg-h span{font-size:12px;color:var(--muted)}
.fg-h button{font-size:12px;color:var(--accent);padding:2px 4px}
.opt{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:3px 8px;border-radius:8px;font-size:14px;transition:background .15s}
.opt:hover{background:var(--sunk)}
.opt .box{flex:none;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.opt.radio .box{border-radius:50%}
.opt .box::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent-ink);transform:scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.opt.radio .box::after{border-radius:50%}
.opt[aria-checked="true"]{background:var(--accent-soft);font-weight:500}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-checked="true"] .box::after{transform:scale(1)}
.opt .lb{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.opt .ct{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.zero,.chip.zero{opacity:.42}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:13px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);font-size:11.5px;opacity:.7}
.fg p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}

.res-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.count{font-size:14px;color:var(--muted);margin:0}
.count b{color:var(--ink);font-family:var(--f-mono);font-size:17px}
.res-tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sort{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:13px}
.filter-btn{display:none;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:500;font-size:14px}
.filter-btn small{font-family:var(--f-mono);background:var(--bg);color:var(--ink);border-radius:99px;padding:0 6px;font-size:11.5px}
.applied{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
.ap{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 4px 2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.ap i{font-style:normal;font-weight:400;opacity:.75}
.ap span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;transition:background .15s,color .15s}
.ap:hover span{background:var(--accent);color:var(--accent-ink)}
.clear-all{color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 6px;min-height:30px;font-size:13px}
.clear-all:hover{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;cursor:pointer;transition:border-color .2s,box-shadow .2s;content-visibility:auto;contain-intrinsic-size:auto 170px}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.grid{animation:rise .25s backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card-top{display:flex;align-items:center;gap:8px}
.tk{font-family:var(--f-mono);font-weight:600;font-size:17px;letter-spacing:.02em}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.bd{font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:5px;white-space:nowrap}
.bd.sp{background:var(--sp-soft);color:var(--sp)} .bd.ndx{background:var(--ndx-soft);color:var(--ndx)} .bd.dow{background:var(--dow-soft);color:var(--dow)} .bd.none{background:var(--sunk);color:var(--muted)}
.star{flex:none;width:32px;height:32px;margin:-6px -8px -6px -4px;display:grid;place-items:center;border-radius:50%;color:var(--muted);opacity:.55;transition:color .2s,opacity .2s,background .2s}
.star:hover{background:var(--sunk);color:var(--star);opacity:1}
.star[aria-pressed="true"]{color:var(--star);opacity:1}
.star[aria-pressed="true"] svg{fill:currentColor;animation:starpop .35s}
@keyframes starpop{50%{transform:scale(1.45)}}
.star svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.nm{font-weight:700;font-size:15.5px;line-height:1.35;overflow-wrap:anywhere}
.nm span{font-weight:400;color:var(--muted);font-size:13px;margin-left:4px}
.sec{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.desc{margin:2px 0 0;font-size:13.5px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.more{display:block;margin:20px auto 0;padding:10px 22px;min-height:44px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:500;transition:border-color .2s}
.more:hover{border-color:var(--accent)}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);margin-bottom:4px}
.empty button{margin-top:14px;padding:8px 18px;min-height:40px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:500}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td .tk{font-size:14px}
td .star{margin:-4px}
td.nmc{min-width:150px}td.nmc small{color:var(--muted);display:block;font-size:12px}
td.nw{white-space:nowrap}

.grp h3{display:flex;align-items:center;gap:8px;font-size:15px;margin:20px 0 8px}
.grp:first-child h3{margin-top:0}
.grp h3 small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:12.5px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12.5px;padding:3px 9px;min-height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--accent);background:var(--accent-soft)}
.pill b{font-family:var(--f-mono);margin-right:5px}

/* ---------- 通用内容 ---------- */
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:30px 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
h2:first-child{margin-top:4px}
h2 small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.ef-toggle{margin-bottom:12px}
@media (max-width:760px){.frows:not(.on){display:none}}
.frows{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-bottom:14px}
.frow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow>b{font-size:13.5px;padding-top:5px}
.etf-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.etf{display:grid;grid-template-columns:76px minmax(0,1.1fr) minmax(0,.8fr) minmax(0,1.6fr);gap:4px 16px;padding:11px 16px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline;transition:background .15s}
.etf:first-child{border-top:0}
.etf:hover{background:var(--sunk)}
.etf .tk{font-size:15px}
.etf .track{color:var(--accent);font-weight:500}
.etf .d{color:var(--muted)}
.etf .iss{display:block;font-size:12px;color:var(--muted)}
.ost{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.ost b{font-weight:600;color:var(--accent)}
.etf .ost{margin-top:4px}
.ost i,.iv{font-style:normal}.hi{color:var(--loss)}.ost .stale{color:var(--warn)}.lo{color:var(--gain)}
.up{color:var(--gain)}.dn{color:var(--loss)}
td.num,th.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}td.dim{color:var(--muted);opacity:.6}
.elinks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:3px}
.elinks a,.lbl a{color:var(--accent);text-decoration:none}.elinks a:hover,.lbl a:hover{text-decoration:underline}
.lbl{display:flex;gap:10px;font-size:12px}
.frow.ohead{display:block;font-size:12.5px;color:var(--muted);padding:10px 0 2px}
.frow.ohead b{font-size:13.5px;color:var(--ink);margin-right:8px}
.opt-zone{border:1px solid var(--line);border-radius:12px;padding:10px 12px 4px;margin:0 0 14px;background:var(--accent-soft)}
.opt-zone .fg{margin-bottom:10px}
.oz-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.oz-h b{font-size:14px}.oz-h span,.oz-n{font-size:11.5px;color:var(--muted)}
.oz-n{margin:0 0 8px}
.obox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.obox div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.obox b{display:block;font-family:var(--f-mono);font-size:16px}.obox span{font-size:11.5px;color:var(--muted)}
.d-h small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:8px}
.etfc{display:flex;flex-direction:column;contain-intrinsic-size:auto 420px}
.etfc .idx-h b{font-size:20px}.etfc .idx-h .tk{font-size:17px}
.etfc p{margin-bottom:10px}
.eopt{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.eopt>b{display:block;font-size:13px;margin-bottom:8px}.eopt>b small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11.5px}
.estat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.estat div{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.estat b{display:block;font-family:var(--f-mono);font-size:16px;white-space:nowrap}.estat span{font-size:11.5px;color:var(--muted)}
.etfc .elinks{margin-top:auto;padding-top:12px;font-size:13px;gap:6px 16px}
.idx-opt{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.idx-opt>b{display:block;font-size:13px;margin-bottom:6px}.idx-opt>b small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11.5px}
.idx-opt>div{padding:6px 0;border-top:1px dashed var(--line)}.idx-opt>div:first-of-type{border-top:0}
.idx-opt .nm2{font-size:12.5px;color:var(--muted);margin-left:8px}
.lb-f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0}
.lbt td,.lbt th{padding:7px 10px}
.lbtk{font-family:var(--f-mono);font-weight:600;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-size:13.5px;text-decoration:none;margin-right:6px}
@media (max-width:560px){.obox{grid-template-columns:repeat(2,minmax(0,1fr))}.lbt th:nth-child(2),.lbt td.nmc{display:none}.lbt td,.lbt th{padding:7px 8px}}
.lev{font-family:var(--f-mono);font-size:11px;padding:0 5px;border-radius:4px;margin-left:6px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
@media (max-width:760px){.etf{grid-template-columns:70px minmax(0,1fr)}.etf .track,.etf .d{grid-column:2}}

.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cmp-c{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.cmp-c h3{margin:0;font-family:var(--f-display);font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.cmp-c h3 span{font-family:var(--f-mono);font-size:22px}
.cmp-c p{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:1px}
.stack i{background:var(--c);min-width:2px;transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.cmp-l{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:12.5px}
.cmp-l li{display:flex;align-items:center;gap:6px;color:var(--muted)}
.cmp-l li b{margin-left:auto;font-family:var(--f-mono);font-weight:500;color:var(--ink);white-space:nowrap}
.go{margin-top:12px;font-size:13px;color:var(--accent);font-weight:500;min-height:32px}
.overlap{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.overlap>*{display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:150px;transition:border-color .2s}
.overlap button:hover{border-color:var(--accent)}
.overlap b{font-family:var(--f-mono);font-size:20px;line-height:1.2}
.overlap span{font-size:12.5px;color:var(--muted)}

.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.idx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 260px}
.idx-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.idx-h b{font-family:var(--f-display);font-size:19px}
.idx-en{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.idx p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.idx dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px;border-top:1px dashed var(--line);padding-top:10px}
.idx dt{color:var(--muted);white-space:nowrap}.idx dd{margin:0;overflow-wrap:anywhere}
.tlink{font-family:var(--f-mono);color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.tlink:hover{text-decoration-color:var(--accent)}

.prose{max-width:900px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.gl div,.steps div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.gl b,.steps b{display:block;font-size:14.5px;margin-bottom:2px;color:var(--ink)}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0}
.kv div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv dt{font-weight:500}.kv dd{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
kbd.k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--surface);color:var(--ink)}
.txt{font-size:14px;color:var(--muted);line-height:1.8;margin:0 0 12px}

.audit-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:8px}
.audit-sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.audit-sum b{font-family:var(--f-mono);font-size:24px;display:block;line-height:1.2}
.audit-sum span{font-size:13px;color:var(--muted)}
.fix{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.fix h3{margin:0 0 6px;font-size:15.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fix p,.fix li{font-size:14px;color:var(--muted);margin:0}
.fix ul{margin:6px 0 0;padding-left:1.2em}
.fix li{margin:3px 0}
.fix .src{margin-top:8px;font-size:12.5px}
.io{font-family:var(--f-mono);font-size:12.5px;padding:1px 6px;border-radius:5px;margin:0 2px;white-space:nowrap;display:inline-block}
.io.in{background:var(--accent-soft);color:var(--accent)} .io.out{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.tag{font-size:11.5px;padding:1px 8px;border-radius:99px;font-weight:500}
.tag.fixd{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--accent-soft);color:var(--accent)} .tag.todo{background:var(--sunk);color:var(--muted)}

/* ---------- 交易台 ---------- */
.now{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:18px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px;width:100%;transition:border-color .2s}
.now:hover{border-color:var(--accent)}
.now .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.now .dot.live{background:var(--gain);box-shadow:0 0 0 4px var(--gain-fill)}
.now .dot.ext{background:var(--star)}
.now b{font-weight:700}
.now .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.now .mu{color:var(--muted)}
.now .go2{margin-left:auto;color:var(--accent);font-weight:500}
.clock{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.clock div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.clock span{display:block;font-size:12.5px;color:var(--muted)}
.clock b{font-family:var(--f-mono);font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:12.5px;color:var(--muted)}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl div{display:grid;grid-template-columns:64px 64px minmax(0,1fr);gap:12px;padding:9px 14px;border-top:1px solid var(--line);font-size:13.5px;align-items:baseline}
.tl div:first-child{border-top:0;font-size:12px;color:var(--muted)}
.tl .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tl .past{opacity:.5}
.tl .next{background:var(--accent-soft)}
.tl .next b::after{content:"下一个";font-size:11px;font-weight:500;margin-left:8px;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.tl span{color:var(--muted)}
.tl b{font-weight:500}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tw table{min-width:640px}
.tw td,.tw th{white-space:nowrap}
.tw td.wr{white-space:normal;min-width:180px;color:var(--muted)}
.tw tbody tr{cursor:default}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.calc input,.calc select{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:15px;min-width:0;width:100%}
.calc input:focus,.calc select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.calc-out{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.calc-out div span{display:block;font-size:12.5px;color:var(--muted)}
.calc-out div b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.calc-out .risk b{color:var(--warn)}
.watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.watch button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--muted);transition:border-color .2s}
.watch button:hover{border-color:var(--accent)}
.watch b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.tg{font-size:11px;font-weight:500;padding:1px 6px;border-radius:5px;white-space:nowrap;background:var(--sunk);color:var(--muted)}

.secnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:6px}
.secnav button{flex:none}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tool-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tool label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.tool input,.tool select{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:15px;min-width:0;width:100%}
.tool input:focus,.tool select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.legs{display:grid;gap:8px;margin-bottom:12px}
.leg{display:grid;grid-template-columns:minmax(110px,1.2fr) 1fr 1fr;gap:10px;align-items:end}
.leg>b{font-size:13.5px;padding-bottom:10px;white-space:nowrap}
.leg>b.buy{color:var(--gain)}.leg>b.sell{color:var(--loss)}
.chart{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .pl{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.chart .gf{fill:var(--gain-fill)}.chart .lf{fill:var(--loss-fill)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .be{stroke:var(--accent);stroke-width:1.5}
.chart .bet{fill:var(--accent)}
.chart .cur{stroke:var(--star);stroke-width:1.5;stroke-dasharray:2 3}
.chart .hv{stroke:var(--ink);stroke-width:1;opacity:.5}
.readout{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px;min-height:22px}
.readout b{font-family:var(--f-mono);color:var(--ink)}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.outs span{display:block;font-size:12.5px;color:var(--muted)}
.outs b{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums}
.outs .g b{color:var(--gain)}.outs .l b{color:var(--loss)}
.osi{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.osi span{display:flex;flex-direction:column;padding:8px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.osi b{font-family:var(--f-mono);font-size:16px;color:var(--ink)}

  while(i<items.length){const short=Math.min(w,h);let row=[items[i]],sum=items[i].a,worst=wr(row,sum,short),j=i+1;
    while(j<items.length){const r2=row.concat(items[j]),s2=sum+items[j].a,w2=wr(r2,s2,short);if(w2>worst)break;row=r2;sum=s2;worst=w2;j++}
    const th=sum/short;if(w>=h){let yy=y;for(const it of row){const hh=it.a/th;out.push({n:it.n,x,y:yy,w:th,h:hh});yy+=hh}x+=th;w-=th}
    else{let xx=x;for(const it of row){const ww=it.a/th;out.push({n:it.n,x:xx,y,w:ww,h:th});xx+=ww}y+=th;h-=th}i=j}return out}

<div style="padding:7px 0"><dt>卖出开仓 STO</dt><dd>卖出期权收权利金，成为卖方。</dd></div>
<div style="padding:7px 0"><dt>买入平仓 BTC</dt><dd>把之前卖的期权买回来，了结。</dd></div>
</dl><p class="d-sm">平仓时选错成“开仓”，会变成新开一笔反方向的仓位。</p></div>
</div>
<dl class="kv" style="margin-top:12px">
<div><dt>限价单</dt><dd>期权一律用限价单。先挂在买一和卖一的中间价，没成交再一分钱一分钱往对手价靠。</dd></div>
<div><dt>市价单</dt><dd>价差宽的合约会成交在很差的价格上，开盘头几分钟尤其如此，尽量不用。</dd></div>
<div><dt>组合单</dt><dd>价差、铁鹰这类多条腿的策略，用券商的组合单一次下，分开下可能只成交一条腿。</dd></div>
<div><dt>止损</dt><dd>期权报价跳动大，止损市价单容易被瞬间的宽价差触发。更稳妥的做法是按标的价格设提醒，或用止损限价单。</dd></div>
<div><dt>资金要求</dt><dd>买方付足权利金即可。备兑要持有 100 股，现金担保卖 Put 要留出行权价 × 100 的现金，价差按最大亏损占用保证金。能做哪些策略取决于券商给的期权权限等级。</dd></div>
</dl>

<h2 id="sec-pick">怎么选合约</h2>
<dl class="kv">
<div><dt>先看流动性</dt><dd>选成交量和持仓量大的行权价，价差最好不超过期权价格的 5%–10%。整数行权价和月度到期通常最活跃。</dd></div>
<div><dt>用 Delta 选行权价</dt><dd>Delta 0.6–0.8 的实值期权跟涨跟跌更紧、时间价值少；0.5 左右的平值期权 Gamma 最大；0.2–0.3 的虚值期权便宜但需要大行情，多数到期归零。</dd></div>
<div><dt>到期日留余量</dt><dd>买方给自己的时间要比预期行情长。日内短打可以用当周或当天到期，隔夜持仓至少选两三周以后，减轻时间衰减。</dd></div>
<div><dt>看 IV 高低</dt><dd>IV30 要跟这只标的自己平时比：明显高于平时，期权就贵，更适合卖方或价差；明显低于平时，买方成本低。不同标的之间的 IV 不能直接比。</dd></div>
<div><dt>价内外怎么算</dt><dd>期权价格 = 内在价值 + 时间价值。Call 的内在价值是 max(股价 − 行权价, 0)，Put 是 max(行权价 − 股价, 0)。虚值期权全是时间价值，到期归零。</dd></div>
</dl>

<h2 id="sec-earn">财报和事件前后</h2>
<dl class="kv">
<div><dt>先算预期波动</dt><dd>用最近到期的平值跨式价格（Call + Put）除以股价，就是市场定价的财报涨跌幅。实际波动小于它，买方亏；大于它，买方赚。</dd></div>
<div><dt>波动率回落</dt><dd>财报公布后 IV 会立刻大跌。单买期权即使方向对了也可能亏，用价差可以抵消一部分。</dd></div>
<div><dt>公布时间</dt><dd>多数公司在盘后（16:00 后）或盘前公布，期权要到下一个开盘才能交易，中间无法止损。</dd></div>
<div><dt>卖方的风险</dt><dd>财报跳空可以一次吃掉几个月的权利金，卖方一定要用有保护的结构（价差、铁鹰），不裸卖。</dd></div>
<div><dt>宏观事件</dt><dd>CPI、非农、美联储决议对 SPY、QQQ 期权的影响和财报对个股类似，当天到期的期权事件前偏贵。</dd></div>
</dl>

<h2 id="sec-risk">仓位和风控</h2>
<dl class="kv">
<div><dt>单笔上限</dt><dd>先定每笔最多亏多少（常见做法是账户的 1%–2%），再倒推张数。买方的最大亏损就是权利金。</dd></div>
<div><dt>别等归零</dt><dd>给买入的期权设一个止损线（例如亏掉一半就走），不要把“最多亏光”当成计划。</dd></div>
<div><dt>到期日当天</dt><dd>不想接股票或交出股票，就在收盘前平掉实值和接近平值的仓位。卖方不要为了省几分钱留着快归零的期权。</dd></div>
<div><dt>卖方留余地</dt><dd>卖出期权的收益有限、亏损可以很大。收到权利金的 50%–70% 就可以考虑买回，不必拿到最后一天。</dd></div>
<div><dt>注意相关性</dt><dd>同时持有 NVDA、AMD、SMH、QQQ 的看涨期权，实际上是同一个方向的四倍仓位。</dd></div>
</dl>

<h2 id="sec-greek">希腊字母<small>日内最该看的是 Delta、Gamma、Theta</small></h2>
<div class="gl">
<div><b>Delta</b>标的涨 1 美元，期权大约涨多少。平值期权约 0.5，也可以粗略当成到期变成实值的概率。</div>
<div><b>Gamma</b>标的每动 1 美元，Delta 变多少。越临近到期、越接近平值，Gamma 越大，价格变化越剧烈。</div>
<div><b>Theta</b>每过一天期权损失多少时间价值。到期前最后几天加速，当天到期的期权按小时衰减。</div>
<div><b>Vega</b>隐含波动率变 1 个百分点，期权价格变多少。到期越远 Vega 越大。</div>
<div><b>隐含波动率（IV）</b>市场对未来波动的定价。IV 高说明期权贵，买方需要更大的行情才能赚钱。</div>
<div><b>财报后的波动率回落</b>财报前 IV 被推高，公布后立刻回落。方向看对了，买入的期权也可能因为 IV 下降而亏钱。</div>
<div><b>价差（Bid-Ask）</b>买一和卖一的差。价差占期权价格的比例越大，进出一次的成本越高，尽量用限价单。</div>
<div><b>持仓量与成交量</b>持仓量是未平仓合约数，成交量是当天成交张数。两者都大的行权价，价差通常更小。</div>
</div>

<h2 id="sec-strat">常用策略对照</h2>
<div class="tw"><table><thead><tr><th>策略</th><th>怎么做</th><th>看法</th><th>最大亏损</th><th>最大盈利</th><th>要注意</th></tr></thead><tbody>
<tr><td><b>买入看涨</b></td><td>买 Call</td><td>看涨</td><td>权利金</td><td>不封顶</td><td class="wr">时间和 IV 下降都对你不利，要涨得够快。</td></tr>
<tr><td><b>买入看跌</b></td><td>买 Put</td><td>看跌</td><td>权利金</td><td>行权价 − 权利金</td><td class="wr">下跌时 IV 通常上升，对买方有利。</td></tr>
<tr><td><b>牛市看涨价差</b></td><td>买低行权价 Call，卖高行权价 Call</td><td>温和看涨</td><td>净支出</td><td>行权价差 − 净支出</td><td class="wr">成本比单买低，受 IV 和时间的影响小，盈利被封顶。</td></tr>
<tr><td><b>熊市看跌价差</b></td><td>买高行权价 Put，卖低行权价 Put</td><td>温和看跌</td><td>净支出</td><td>行权价差 − 净支出</td><td class="wr">同上，方向相反。</td></tr>
<tr><td><b>卖出看跌价差</b></td><td>卖高行权价 Put，买低行权价 Put</td><td>不跌就行</td><td>行权价差 − 净收入</td><td>净收入</td><td class="wr">赚时间价值，胜率高但单次亏损大于单次盈利。</td></tr>
<tr><td><b>铁鹰</b></td><td>同时卖出看涨价差和看跌价差</td><td>区间震荡</td><td>单边价差 − 净收入</td><td>净收入</td><td class="wr">适合 IV 高、预期波动不大的时候。</td></tr>
<tr><td><b>跨式 / 宽跨式</b></td><td>同时买 Call 和 Put</td><td>大波动，方向不定</td><td>两份权利金</td><td>不封顶</td><td class="wr">财报前买入要小心波动率回落。</td></tr>
<tr><td><b>备兑看涨</b></td><td>持有 100 股，卖 Call</td><td>不大涨</td><td>股票下跌的亏损</td><td>权利金 + 涨到行权价的收益</td><td class="wr">大涨时股票会被行权价买走。</td></tr>
<tr><td><b>现金担保卖 Put</b></td><td>留足现金，卖 Put</td><td>愿意在行权价接股</td><td>行权价 − 权利金</td><td>权利金</td><td class="wr">跌破行权价要按行权价买入 100 股。</td></tr>
</tbody></table></div>

<p class="d-sm">规则按期权清算公司（OCC）和交易所的公开规则整理，各家券商的截止时间和保证金要求不同，下单前请以券商页面为准。本页不构成投资建议。</p>
</div>`}
