# 每个美股交易日收盘后，从 Cboe 抓期权数据、重新生成网页并发布到 GitHub Pages。
# GitHub 的定时任务常常晚几个小时才开始，甚至漏掉，所以一天安排 4 个时间（北京时间早上 5:45、7:15、8:45、10:15，
# 即美股收盘后 45 分钟起），先到的那次完整更新；后面的发现网站数据是 10 小时内抓的就直接跳过，不会重复抓。
# 仓库里的文件有改动时（比如推送了新模板），只用最近一次的数据重新生成网页，约 30 秒；
# 推送时提交说明里带“[完整更新]”，就改为完整更新（不用打开 GitHub 网页也能手动触发）。
# 盘前更新（pre）由 Cloudflare 在每个交易日 UTC 13:00 触发（美东 8:00 或 9:00，北京时间 21:00），不依赖 GitHub 的定时，因为盘前数据晚了就没用。
# 手动运行可选：full 全量抓取（约 30 分钟，含分时走势和新闻翻译）/ rebuild 只重新生成网页 / quick 只抓 60 只测试。
# 完整更新后，最新数据（期权、分时走势、走势记录）会存回仓库的 src/data/，在电脑上 git pull 就能拿到。
name: 每日更新期权数据

on:
  schedule:
    - cron: '45 21 * * 1-5'
    - cron: '15 23 * * 1-5'
    - cron: '45 0 * * 2-6'
    - cron: '15 2 * * 2-6'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full 全量抓取 / rebuild 只重新生成网页 / quick 只抓 60 只测试 / pre 盘前更新（小盘股盘前行情） / auto 完整更新，但网站数据 10 小时内更新过就跳过（Cloudflare 定时触发用这个）'
        type: choice
        options: [full, rebuild, quick, auto, pre, occ]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  # 定时触发时先看网站上的数据是不是刚更新过，是就跳过这次
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
      mode: ${{ steps.c.outputs.mode }}
    steps:
      - id: c
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.mode }}" != "auto" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          read h pend < <(curl -fsSL "$PAGES_URL/options_latest.json" | python3 -c 'import json,sys,datetime as D;d=json.load(sys.stdin);t=D.datetime.fromisoformat(d["fetched"][:19]);print(int((D.datetime.utcnow()-t).total_seconds()//3600),1 if d.get("occ_pending") else 0)' || echo 99 0)
          echo "网站上的数据是 $h 小时前抓的"
          if [ "$h" -lt 10 ] && [ "$pend" = "1" ]; then echo "已经更新过，但 OCC 成交量还没补上：只补成交量"; echo "go=1" >> "$GITHUB_OUTPUT"; echo "mode=occ" >> "$GITHUB_OUTPUT"
          elif [ "$h" -lt 10 ]; then echo "已经更新过，这次跳过"; echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ needs.check.outputs.mode || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[完整更新]') && 'full' || 'rebuild') || github.event_name == 'schedule' && 'full' || (inputs.mode == 'auto' && 'full' || inputs.mode)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 准备走势记录
        run: |
          mkdir -p src/data
          # 仓库里还没有走势记录时，沿用网站上的那份
          [ -f src/data/hist.json ] || curl -fsSL "$PAGES_URL/hist.json" -o src/data/hist.json || true
      - name: 准备期权数据（模式：${{ env.MODE }}）
        run: |
          if [ "$MODE" = "rebuild" ] || [ "$MODE" = "pre" ] || [ "$MODE" = "occ" ]; then
            # 仓库里的数据和网站上的，哪份新用哪份
            mkdir -p /tmp/site
            curl -fsSL "$PAGES_URL/options_latest.json" -o /tmp/site/options_latest.json || true
            curl -fsSL "$PAGES_URL/intraday.json" -o /tmp/site/intraday.json || true
            curl -fsSL "$PAGES_URL/small.json" -o /tmp/site/small.json || true
            curl -fsSL "$PAGES_URL/small_profiles.json" -o /tmp/site/small_profiles.json || true
            curl -fsSL "$PAGES_URL/premarket.json" -o /tmp/site/premarket.json || true
            curl -fsSL "$PAGES_URL/ipo.json" -o /tmp/site/ipo.json || true
            python3 -c 'import json,os,shutil;[(shutil.copy("/tmp/site/"+f,"src/data/"+f),print("用网站上较新的",f)) for f,k in (("options_latest.json","fetched"),("intraday.json","d"),("small.json","d"),("small_profiles.json","d"),("premarket.json","t"),("ipo.json","t")) if os.path.exists("/tmp/site/"+f) and json.load(open("/tmp/site/"+f)).get(k,"")>(json.load(open("src/data/"+f)).get(k,"") if os.path.exists("src/data/"+f) else "")]'
            [ -f src/data/options_latest.json ] || python3 src/fetch_cboe.py --min 700
            # 盘前更新：抓小盘股的盘前行情（取不到也不影响其他数据）
            if [ "$MODE" = "pre" ]; then python3 src/fetch_cboe.py --premarket || echo "盘前数据没取到"; fi
            # 完整更新时 OCC 还没公布当天成交量的，盘前和补数任务里用 OCC 的补上
            if [ "$MODE" = "pre" ] || [ "$MODE" = "occ" ]; then python3 src/fetch_cboe.py --occ-patch || echo "OCC 成交量没补上"; fi
            # 盘前顺便刷新新股 IPO 日历（当天要上市的新股常常前一晚才定价）
            if [ "$MODE" = "pre" ]; then python3 src/fetch_cboe.py --ipo-only || echo "IPO 数据没取到"; fi
          elif [ "$MODE" = "quick" ]; then
            python3 src/fetch_cboe.py --limit 60 --min 50 --intraday
          else
            # 上一次已经翻译过的新闻标题直接复用，省翻译额度
            curl -fsSL "$PAGES_URL/options_latest.json" -o src/data/prev_news.json || cp src/data/options_latest.json src/data/prev_news.json || true
            python3 src/fetch_cboe.py --min 700
          fi
      - name: 把最新数据存回仓库
        if: env.MODE == 'full' || env.MODE == 'occ'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hist.json src/data/options_latest.json src/data/intraday.json
          [ -f src/data/small.json ] && git add src/data/small.json || true
          [ -f src/data/small_profiles.json ] && git add src/data/small_profiles.json || true
          [ -f src/data/ipo.json ] && git add src/data/ipo.json || true
          git commit -m "数据 $(python3 -c 'import json;print(json.load(open("src/data/options_latest.json"))["date"])')" || echo "没有变化"
          # 运行期间仓库可能有新提交，先合并再推送，最多试 3 次
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done || echo "推送失败，下次再存"
      - name: 生成网页
        run: python3 src/build.py
      - name: 准备发布文件
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp src/data/options_latest.json _site/options_latest.json
          [ -f src/data/hist.json ] && cp src/data/hist.json _site/hist.json || true
          [ -f src/data/intraday.json ] && cp src/data/intraday.json _site/intraday.json || true
          [ -f src/data/small.json ] && cp src/data/small.json _site/small.json || true
          [ -f src/data/small_profiles.json ] && cp src/data/small_profiles.json _site/small_profiles.json || true
          [ -f src/data/premarket.json ] && cp src/data/premarket.json _site/premarket.json || true
          [ -f src/data/ipo.json ] && cp src/data/ipo.json _site/ipo.json || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
