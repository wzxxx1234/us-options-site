# 每个美股交易日收盘后，从 Cboe 抓期权数据、重新生成网页并发布到 GitHub Pages。
# 21:45 UTC 周一到周五 = 北京时间周二到周六早上 5:45（美股收盘后约 45 分钟；GitHub 的定时任务常会晚几十分钟到几小时才开始）。
# 仓库里的文件有改动时（比如上传了新模板），只用上一次的数据重新生成网页，约 30 秒。
# 手动运行可选：full 全量抓取（约 30 分钟，含分时走势和新闻翻译）/ rebuild 只重新生成网页 / quick 只抓 60 只测试。
name: 每日更新期权数据

on:
  schedule:
    - cron: '45 21 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full 全量抓取 / rebuild 只重新生成网页 / quick 只抓 60 只测试'
        type: choice
        options: [full, rebuild, quick]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ github.event_name == 'push' && 'rebuild' || github.event_name == 'schedule' && 'full' || inputs.mode }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 整理文件位置（仓库里的文件都在根目录，脚本需要 src/ 和 src/data/）
        run: |
          mkdir -p src/data
          for f in build.py fetch_cboe.py template.html; do [ -f "$f" ] && cp "$f" src/; done
          for f in data.json etf_extra.json mcap.json hist.json; do [ -f "$f" ] && cp "$f" src/data/; done
          # 仓库里还没有走势记录时，沿用网站上的那份
          [ -f src/data/hist.json ] || curl -fsSL "$PAGES_URL/hist.json" -o src/data/hist.json || true
          ls -R src
      - name: 准备期权数据（模式：${{ env.MODE }}）
        run: |
          if [ "$MODE" = "rebuild" ] && curl -fsSL "$PAGES_URL/options_latest.json" -o src/data/options_latest.json; then
            echo "沿用网站上一次的数据"
            curl -fsSL "$PAGES_URL/intraday.json" -o src/data/intraday.json || true
            # 仓库里手动上传的数据比网站上的新，就用上传的（下一次完整更新后网站上的更新，又会用回网站的）
            python3 -c 'import json,os,shutil;[(shutil.copy(f,"src/data/"+f),print("用仓库里上传的",f)) for f,k in (("options_latest.json","fetched"),("intraday.json","d")) if os.path.exists(f) and json.load(open(f)).get(k,"")>(json.load(open("src/data/"+f)).get(k,"") if os.path.exists("src/data/"+f) else "")]'
          elif [ "$MODE" = "quick" ]; then
            python3 src/fetch_cboe.py --limit 60 --min 50 --intraday
          else
            # 上一次网站上的新闻已经翻译过的标题直接复用，省翻译额度
            curl -fsSL "$PAGES_URL/options_latest.json" -o src/data/prev_news.json || true
            python3 src/fetch_cboe.py --min 700
          fi
      - name: 保存走势记录（每天一笔，存回仓库的 hist.json）
        if: env.MODE == 'full'
        run: |
          cp src/data/hist.json hist.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hist.json
          git commit -m "记录 $(date -u +%F) 期权成交和 IV30" || echo "没有变化"
          # 运行期间仓库可能有新提交，先合并再推送，最多试 3 次
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done || echo "推送失败，下次再记"
      - name: 生成网页
        run: python3 src/build.py
      - name: 准备发布文件
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp src/data/options_latest.json _site/options_latest.json
          [ -f src/data/hist.json ] && cp src/data/hist.json _site/hist.json || true
          [ -f src/data/intraday.json ] && cp src/data/intraday.json _site/intraday.json || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
