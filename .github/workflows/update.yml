# 每个美股交易日收盘后，从 Cboe 抓期权数据、重新生成网页并发布到 GitHub Pages。
# 21:45 UTC 周一到周五 = 北京时间周二到周六早上 5:45（美股收盘后约 45 分钟；GitHub 的定时任务常会晚几十分钟到几小时才开始）。
# 仓库里的文件有改动时（比如推送了新模板），只用最近一次的数据重新生成网页，约 30 秒。
# 手动运行可选：full 全量抓取（约 30 分钟，含分时走势和新闻翻译）/ rebuild 只重新生成网页 / quick 只抓 60 只测试。
# 完整更新后，最新数据（期权、分时走势、走势记录）会存回仓库的 src/data/，在电脑上 git pull 就能拿到。
name: 每日更新期权数据

on:
  schedule:
    - cron: '45 21 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full 全量抓取 / rebuild 只重新生成网页 / quick 只抓 60 只测试'
        type: choice
        options: [full, rebuild, quick]
        default: full

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ github.event_name == 'push' && 'rebuild' || github.event_name == 'schedule' && 'full' || inputs.mode }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 准备走势记录
        run: |
          mkdir -p src/data
          # 仓库里还没有走势记录时，沿用网站上的那份
          [ -f src/data/hist.json ] || curl -fsSL "$PAGES_URL/hist.json" -o src/data/hist.json || true
      - name: 准备期权数据（模式：${{ env.MODE }}）
        run: |
          if [ "$MODE" = "rebuild" ]; then
            # 仓库里的数据和网站上的，哪份新用哪份
            mkdir -p /tmp/site
            curl -fsSL "$PAGES_URL/options_latest.json" -o /tmp/site/options_latest.json || true
            curl -fsSL "$PAGES_URL/intraday.json" -o /tmp/site/intraday.json || true
            python3 -c 'import json,os,shutil;[(shutil.copy("/tmp/site/"+f,"src/data/"+f),print("用网站上较新的",f)) for f,k in (("options_latest.json","fetched"),("intraday.json","d")) if os.path.exists("/tmp/site/"+f) and json.load(open("/tmp/site/"+f)).get(k,"")>(json.load(open("src/data/"+f)).get(k,"") if os.path.exists("src/data/"+f) else "")]'
            [ -f src/data/options_latest.json ] || python3 src/fetch_cboe.py --min 700
          elif [ "$MODE" = "quick" ]; then
            python3 src/fetch_cboe.py --limit 60 --min 50 --intraday
          else
            # 上一次已经翻译过的新闻标题直接复用，省翻译额度
            curl -fsSL "$PAGES_URL/options_latest.json" -o src/data/prev_news.json || cp src/data/options_latest.json src/data/prev_news.json || true
            python3 src/fetch_cboe.py --min 700
          fi
      - name: 把最新数据存回仓库
        if: env.MODE == 'full'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hist.json src/data/options_latest.json src/data/intraday.json
          git commit -m "数据 $(python3 -c 'import json;print(json.load(open("src/data/options_latest.json"))["date"])')" || echo "没有变化"
          # 运行期间仓库可能有新提交，先合并再推送，最多试 3 次
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done || echo "推送失败，下次再存"
      - name: 生成网页
        run: python3 src/build.py
      - name: 准备发布文件
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp src/data/options_latest.json _site/options_latest.json
          [ -f src/data/hist.json ] && cp src/data/hist.json _site/hist.json || true
          [ -f src/data/intraday.json ] && cp src/data/intraday.json _site/intraday.json || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
