# 每个美股交易日收盘后，从 Cboe 抓期权数据、重新生成网页并发布到 GitHub Pages。
# 23:30 UTC 周一到周五 = 北京时间周二到周六早上 7:30（GitHub 的定时任务可能晚几十分钟才开始）。
# 手动运行时可以勾选“快速测试”：只抓前 60 只，约 1 分钟，用来确认流程是通的。
name: 每日更新期权数据

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      quick:
        description: '快速测试（只抓 60 只）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 整理文件位置（仓库里的文件都在根目录，脚本需要 src/ 和 src/data/）
        run: |
          mkdir -p src/data
          for f in build.py fetch_cboe.py template.html; do [ -f "$f" ] && cp "$f" src/; done
          for f in data.json etf_extra.json; do [ -f "$f" ] && cp "$f" src/data/; done
          ls -R src
      - name: 抓 Cboe 期权数据
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            python3 src/fetch_cboe.py --limit 60 --min 50
          else
            python3 src/fetch_cboe.py --min 700
          fi
      - name: 生成网页
        run: python3 src/build.py
      - name: 准备发布文件
        run: |
          mkdir _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
